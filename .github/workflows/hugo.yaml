# Sample workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches:
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Around 02:17 NZST / 03:17 NZDT; Drive remains the staff publishing tool.
  schedule:
    - cron: '17 14 * * *'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      # Keep in sync with local Hugo; templates use hugo.Sites (requires >= 0.156.0).
      HUGO_VERSION: 0.165.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install newsletter and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-eng tesseract-ocr-fra
          python3 -m pip install -r scripts/requirements-search.txt
      - name: Restore newsletter download cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/newsletters
          key: newsletters-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: newsletters-v1-
      - name: Import public newsletters and check PDF search cache
        run: |
          python3 scripts/sync_newsletters.py
          python3 scripts/index_pdfs.py --check
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          # For maximum backward compatibility with Hugo modules
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
          TZ: Pacific/Auckland
        run: |
          hugo \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Validate site and search index
        run: |
          python3 scripts/check_site.py public
          python3 scripts/check_search.py public
          node scripts/test_search.cjs
          python3 scripts/test_search_build.py
          python3 scripts/test_newsletters.py
      - name: Save imported newsletter archive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/documents.json data/pdf_text.json data/newsletters.json static
          if ! git diff --cached --quiet; then
            git commit -m 'Sync published newsletters from public Google Drive'
            git push origin HEAD:main
          fi
      - name: Save validated newsletter cache
        uses: actions/cache/save@v4
        with:
          path: .cache/newsletters
          key: newsletters-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
