{{ $ui := index hugo.Data.interface .Lang }}<div class="faq-toolbar"><nav class="section-pills" aria-label="{{ $ui.onpage }}">{{ range .Params.groups }}<a href="#{{ .id }}">{{ .title }}</a>{{ end }}</nav><button class="text-button" type="button" id="faq-expand" data-expand="{{ $ui.all }}" data-collapse="{{ $ui.collapse }}" hidden>{{ $ui.all }}</button></div><div class="faq-list">{{ range .Params.groups }}<section id="{{ .id }}"><h2>{{ .title }}</h2>{{ range .questions }}<details class="faq-item"><summary>{{ .question }}</summary><div class="prose">{{ $.RenderString (dict "display" "block") .answer }}</div></details>{{ end }}</section>{{ end }}</div>
