<a class="feature-card" href="{{ .url }}"><div class="card-copy"><h2>{{ partial "link-title.html" . }}</h2>{{ with .description }}<p>{{ . }}</p>{{ end }}<span class="card-arrow" aria-hidden="true">{{ if hasPrefix .url "https://" }}↗{{ else }}→{{ end }}</span>{{ if in .url ".pdf" }}<span class="link-kind">PDF</span>{{ else if hasPrefix .url "https://" }}<span class="link-kind">{{ .externalLabel }}</span>{{ end }}</div></a>
